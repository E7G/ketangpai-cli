[package]
name = "ketangpai-cli"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Read-only Ketangpai student CLI and MCP server"
default-run = "ktp"

[[bin]]
name = "ktp"
path = "src/main.rs"

[dependencies]
aes = "0.8.4"
base64 = "0.22"
cbc = "0.1.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
html-escape = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
rmcp = { version = "3.11", features = ["transport-io", "schemars"] }
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = "1.8"

[profile.release]
strip = true
